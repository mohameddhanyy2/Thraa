# Local development dependencies: PostgreSQL and RabbitMQ.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: thraa_user
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: thraa_identity
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres-data:
